name: healthcheck-prometheus
services:
  checker:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      demo-app:
        condition: service_healthy
    networks: [monitoring]
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  demo-app:
    image: python:3.12.10-slim-bookworm
    user: "10001:10001"
    command: ["python", "-B", "-u", "/app/app.py"]
    volumes:
      - ./demo:/app:ro
    ports: ["127.0.0.1:8080:8080"]
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  prometheus:
    image: prom/prometheus:v3.3.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
networks:
  monitoring: {}
volumes:
  prometheus-data: {}
  grafana-data: {}
