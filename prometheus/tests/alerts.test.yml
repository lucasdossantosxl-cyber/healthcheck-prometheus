rule_files:
  - ../alerts.yml
evaluation_interval: 15s

tests:
  - name: TargetDown espera um minuto e resolve na recuperação
    interval: 15s
    input_series:
      - series: 'healthcheck_up{target="demo-app",job="healthcheck",instance="checker:8000"}'
        values: '0+0x5 1+0x3'
      - series: 'up{job="healthcheck",instance="checker:8000"}'
        values: '1+0x9'
    alert_rule_test:
      - eval_time: 45s
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 1m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              target: demo-app
              job: healthcheck
              instance: checker:8000
              severity: warning
            exp_annotations:
              summary: 'Alvo demo-app indisponível'
              description: 'A checagem falhou por pelo menos um minuto.'
      - eval_time: 1m30s
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 1m
        alertname: CheckerDown
        exp_alerts: []

  - name: CheckerDown detecta falha de coleta mesmo sem métricas dos alvos
    interval: 15s
    input_series:
      - series: 'up{job="healthcheck",instance="checker:8000"}'
        values: '0+0x5 1+0x3'
    alert_rule_test:
      - eval_time: 45s
        alertname: CheckerDown
        exp_alerts: []
      - eval_time: 1m
        alertname: CheckerDown
        exp_alerts:
          - exp_labels:
              job: healthcheck
              instance: checker:8000
              severity: warning
            exp_annotations:
              summary: 'Checker indisponível'
              description: 'O Prometheus não consegue coletar as métricas do checker há pelo menos um minuto.'
      - eval_time: 1m30s
        alertname: CheckerDown
        exp_alerts: []
      - eval_time: 1m
        alertname: TargetDown
        exp_alerts: []

  - name: Serviços saudáveis e outros jobs não disparam alertas
    interval: 15s
    input_series:
      - series: 'healthcheck_up{target="demo-app",job="healthcheck",instance="checker:8000"}'
        values: '1+0x9'
      - series: 'up{job="healthcheck",instance="checker:8000"}'
        values: '1+0x9'
      - series: 'up{job="other",instance="other:9000"}'
        values: '0+0x9'
    alert_rule_test:
      - eval_time: 2m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 2m
        alertname: CheckerDown
        exp_alerts: []
