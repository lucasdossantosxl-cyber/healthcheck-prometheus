groups:
  - name: healthcheck
    rules:
      - alert: TargetDown
        expr: healthcheck_up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Alvo {{ $labels.target }} indisponível'
          description: 'A checagem falhou por pelo menos um minuto.'
      - alert: CheckerDown
        expr: up{job="healthcheck"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'Checker indisponível'
          description: 'O Prometheus não consegue coletar as métricas do checker há pelo menos um minuto.'
